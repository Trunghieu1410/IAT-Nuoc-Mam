<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IAT Test - Nước Mắm Truyền Thống</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: white;
            color: black;
            overflow: hidden;
        }

        #app {
            width: 66.67vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            margin: 0 auto;
            background: #f9f9f9;
            border-left: 1px solid #ddd;
            border-right: 1px solid #ddd;
        }

        /* Instructions */
        #instructions {
            max-width: 900px;
            width: 90%;
            text-align: center;
            padding: 40px;
        }

        .btn {
            width: 100%;
            max-width: 400px;
            padding: 15px;
            background: #8B0000;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #A52A2A;
        }

        #instructions h1 {
            color: #8B0000;
            margin-bottom: 30px;
            font-size: 36px;
        }

        #instructions p {
            font-size: 20px;
            line-height: 1.8;
            margin-bottom: 20px;
            text-align: left;
        }

        #instructions ul {
            text-align: left;
            font-size: 20px;
            line-height: 1.8;
            margin: 20px 0;
            margin-left: 40px;
        }

        #instructions .word-list {
            background: #f5f5f5;
            padding: 30px;
            border-radius: 10px;
            margin: 30px 0;
            text-align: left;
        }

        #instructions .word-category {
            margin-bottom: 20px;
        }

        #instructions .word-category h3 {
            color: #8B0000;
            margin-bottom: 10px;
        }

        #instructions .warning {
            color: red;
            font-weight: 600;
            margin-top: 30px;
        }

        /* Trial Screen */
        #trial-screen {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .category-labels {
            position: absolute;
            top: 50px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 100px;
        }

        .category-label {
            font-size: 28px;
            font-weight: 700;
            background: transparent;
            padding: 20px 40px;
            border-radius: 10px;
            border: none;
        }

        .category-left {
            text-align: left;
        }

        .category-right {
            text-align: right;
        }

        .category-label.green {
            color: #228B22;
        }

        .category-label.blue {
            color: #0052CC;
        }

        .category-label .category-main {
            display: block;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .category-label .category-main.green {
            color: #228B22;
        }

        .category-label .category-main.blue {
            color: #0052CC;
        }

        .category-label .category-or {
            display: block;
            font-size: 32px;
            color: black;
            margin: 8px 0;
        }

        .category-label .category-sub {
            display: block;
            font-size: 32px;
        }

        .category-label .category-sub.green {
            color: #228B22;
        }

        .category-label .category-sub.blue {
            color: #0052CC;
        }

        #stimulus {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 80px;
            font-weight: 700;
            text-align: center;
            color: black;
        }

        #stimulus.traditional,
        #stimulus.industrial {
            color: #228B22;
        }

        #stimulus.positive,
        #stimulus.negative {
            color: #0052CC;
        }

        #feedback {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 100px;
            color: red;
            font-weight: 900;
        }

        .instruction-text {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 18px;
            text-align: center;
            color: #333;
            max-width: 600px;
        }

        /* End Screen */
        #end-screen {
            text-align: center;
        }

        #end-screen h1 {
            font-size: 48px;
            color: #8B0000;
            margin-bottom: 30px;
        }

        #end-screen p {
            font-size: 24px;
            line-height: 1.6;
        }

        /* Cancelled Screen */
        #cancelled-screen {
            text-align: center;
        }

        #cancelled-screen h1 {
            font-size: 48px;
            color: red;
            margin-bottom: 30px;
        }

        #cancelled-screen p {
            font-size: 24px;
            line-height: 1.6;
        }

        .hidden {
            display: none !important;
        }

        /* Key hints */
        .key-hints {
            position: absolute;
            bottom: 50px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 100px;
            font-size: 24px;
            color: #666;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Instructions (initially visible) -->
        <div id="instructions">
            <div id="instruction-content"></div>
            <button class="btn" onclick="nextInstruction()">SPACE - Tiếp tục</button>
        </div>

        <!-- Trial Screen (initially hidden) -->
        <div id="trial-screen" class="hidden">
            <div class="category-labels">
                <div class="category-label category-left" id="left-label"></div>
                <div class="category-label category-right" id="right-label"></div>
            </div>
            <div id="stimulus"></div>
            <div id="feedback" class="hidden"></div>
            <div class="instruction-text">Nếu sai, dấu X đỏ xuất hiện → bấm phím đúng để sửa</div>
            <div class="key-hints">
                <div>← Phím E</div>
                <div>Phím I →</div>
            </div>
        </div>

        <!-- End Screen (initially hidden) -->
        <div id="end-screen" class="hidden">
            <h1>Hoàn thành!</h1>
            <p>Cảm ơn bạn đã tham gia.</p>
            <p id="d-score-display"></p>
            <p style="font-size: 14px; color: #666; margin-top: 20px;">Dữ liệu đã được tải về tự động.</p>
            <p style="font-size: 14px; color: #666;">Bạn có thể đóng tab này.</p>
        </div>

        <!-- Cancelled Screen (initially hidden) -->
        <div id="cancelled-screen" class="hidden">
            <h1>Bài test đã bị hủy</h1>
            <p>Kết quả sẽ KHÔNG được lưu.</p>
            <p style="margin-top: 20px; font-size: 18px;">Bạn có thể đóng tab này hoặc làm lại.</p>
            <button class="btn" onclick="location.reload()" style="margin: 30px auto;">Làm lại</button>
        </div>
    </div>

    <script>
        // ===== DATA STRUCTURES =====
        const participantInfo = {};
        const results = [];
        let currentBlock = 0;
        let currentTrial = 0;
        let trialStartTime = 0;
        let experimentCancelled = false;
        let firstAttemptRT = 0;
        let lastWord = null; // Track the last displayed word // Track first attempt RT

        // Generate automatic participant ID
        function generateParticipantID() {
            return 'P' + Date.now().toString(36).toUpperCase();
        }

        // Initialize participant info with anonymous ID
        participantInfo.loginCode = generateParticipantID();
        participantInfo.name = 'Anonymous';
        participantInfo.age = 'N/A';
        participantInfo.gender = 'N/A';
        participantInfo.region = 'N/A';
        participantInfo.usage = 'N/A';
        participantInfo.testDate = new Date().toISOString();

        // Word lists
        const words = {
            traditional: ["làng nghề", "thủ công", "thùng gỗ", "gia truyền", "lâu đời", "ủ chượp"],
            industrial: ["hệ thống", "nhà máy", "công nghệ", "hiện đại", "công ti", "doanh nghiệp"],
            positive: ["may mắn", "yêu thương", "vui vẻ", "hạnh phúc", "an toàn", "tình bạn"],
            negative: ["bệnh dịch", "chết chóc", "tai nạn", "độc hại", "chiến tranh", "bi kịch"]
        };

        // Block configurations
        const blocks = [
            {
                name: "Phần 1",
                trials: 20,
                leftCategory: "TRUYỀN THỐNG",
                rightCategory: "CÔNG NGHIỆP",
                leftWords: words.traditional,
                rightWords: words.industrial,
                isPractice: true
            },
            {
                name: "Phần 2",
                trials: 20,
                leftCategory: "TÍCH CỰC",
                rightCategory: "TIÊU CỰC",
                leftWords: words.positive,
                rightWords: words.negative,
                isPractice: true
            },
            {
                name: "Phần 3",
                trials: 20,
                leftCategory: "TRUYỀN THỐNG\nhoặc\nTÍCH CỰC",
                rightCategory: "CÔNG NGHIỆP\nhoặc\nTIÊU CỰC",
                leftWords: [...words.traditional, ...words.positive],
                rightWords: [...words.industrial, ...words.negative],
                isPractice: true
            },
            {
                name: "Phần 4",
                trials: 40,
                leftCategory: "TRUYỀN THỐNG\nhoặc\nTÍCH CỰC",
                rightCategory: "CÔNG NGHIỆP\nhoặc\nTIÊU CỰC",
                leftWords: [...words.traditional, ...words.positive],
                rightWords: [...words.industrial, ...words.negative],
                isPractice: false
            },
            {
                name: "Phần 5",
                trials: 20,
                leftCategory: "CÔNG NGHIỆP",
                rightCategory: "TRUYỀN THỐNG",
                leftWords: words.industrial,
                rightWords: words.traditional,
                isPractice: true
            },
            {
                name: "Phần 6",
                trials: 20,
                leftCategory: "CÔNG NGHIỆP\nhoặc\nTÍCH CỰC",
                rightCategory: "TRUYỀN THỐNG\nhoặc\nTIÊU CỰC",
                leftWords: [...words.industrial, ...words.positive],
                rightWords: [...words.traditional, ...words.negative],
                isPractice: true
            },
            {
                name: "Phần 7",
                trials: 40,
                leftCategory: "CÔNG NGHIỆP\nhoặc\nTÍCH CỰC",
                rightCategory: "TRUYỀN THỐNG\nhoặc\nTIÊU CỰC",
                leftWords: [...words.industrial, ...words.positive],
                rightWords: [...words.traditional, ...words.negative],
                isPractice: false
            }
        ];

        // Instructions
        const instructions = [
            {
                title: "Chào mừng",
                content: `
                    <h1>Chào mừng bạn đến với bài test IAT!</h1>
                    <p>Bài test này đo lường các liên kết tự động trong suy nghĩ của bạn về Nước mắm.</p>
                    <ul>
                        <li>Bạn sẽ thấy các từ xuất hiện ở giữa màn hình</li>
                        <li>Nhiệm vụ: phân loại chúng nhanh nhất có thể</li>
                        <li>Nếu sai, dấu X đỏ sẽ xuất hiện → bấm phím đúng để sửa</li>
                    </ul>
                    
                    <div style="text-align: center; margin: 40px 0;">
                        <p style="font-size: 24px; margin-bottom: 20px;"><strong>E</strong> = Chủ đề bên trái</p>
                        <p style="font-size: 24px;"><strong>I</strong> = Chủ đề bên phải</p>
                    </div>
                    
                    <p class="warning">⚠️ Nhấn ESC bất kỳ lúc nào để HUỶ (kết quả KHÔNG lưu)</p>
                `
            },
            {
                title: "Danh sách từ",
                content: `
                    <h1>Danh sách từ</h1>
                    <div class="word-list">
                        <div class="word-category">
                            <h3>TRUYỀN THỐNG:</h3>
                            <p>làng nghề, thủ công, thùng gỗ, gia truyền, lâu đời, ủ chượp</p>
                        </div>
                        <div class="word-category">
                            <h3>CÔNG NGHIỆP:</h3>
                            <p>hệ thống, nhà máy, công nghệ, hiện đại, công ti, doanh nghiệp</p>
                        </div>
                        <div class="word-category">
                            <h3>TÍCH CỰC:</h3>
                            <p>may mắn, yêu thương, vui vẻ, hạnh phúc, an toàn, tình bạn</p>
                        </div>
                        <div class="word-category">
                            <h3>TIÊU CỰC:</h3>
                            <p>bệnh dịch, chết chóc, tai nạn, độc hại, chiến tranh, bi kịch</p>
                        </div>
                    </div>
                    <p>Hãy đọc kỹ các từ này. Nhấn SPACE khi sẵn sàng.</p>
                `
            }
        ];

        let currentInstructionIndex = 0;

        // ===== INITIALIZATION =====
        // Start test immediately when page loads
        window.addEventListener('DOMContentLoaded', function() {
            showInstruction();
            
            // Add keyboard listener
            document.addEventListener('keydown', handleKeyPress);
        });

        // ===== FUNCTIONS =====
        function showInstruction() {
            const inst = instructions[currentInstructionIndex];
            document.getElementById('instruction-content').innerHTML = inst.content;
            document.getElementById('instructions').classList.remove('hidden');
        }

        function nextInstruction() {
            currentInstructionIndex++;
            if (currentInstructionIndex < instructions.length) {
                showInstruction();
            } else {
                // Start first block
                document.getElementById('instructions').classList.add('hidden');
                showBlockInstruction(0);
            }
        }

        function showBlockInstruction(blockIndex) {
            const block = blocks[blockIndex];
            const content = `
                <h1>${block.name}</h1>
                <p style="font-size: 24px; margin: 30px 0;">
                    Bên TRÁI (phím E): <strong>${block.leftCategory.replace('\n', ' + ')}</strong><br><br>
                    Bên PHẢI (phím I): <strong>${block.rightCategory.replace('\n', ' + ')}</strong>
                </p>
                <p>Nhấn SPACE để bắt đầu.</p>
            `;
            document.getElementById('instruction-content').innerHTML = content;
            document.getElementById('instructions').classList.remove('hidden');
        }

        function startBlock() {
            document.getElementById('instructions').classList.add('hidden');
            document.getElementById('trial-screen').classList.remove('hidden');

            const block = blocks[currentBlock];
            const leftLabel = document.getElementById('left-label');
            const rightLabel = document.getElementById('right-label');
            
            recentResponses = []; // Reset response tracking for new block
            
            // Determine colors based on category content
            let leftColor = 'blue';
            let rightColor = 'blue';
            
            // Check if left side contains traditional/industrial (green)
            if (block.leftWords.includes(words.traditional[0]) || block.leftWords.includes(words.industrial[0])) {
                leftColor = 'green';
            }
            // Check if left side contains positive/negative (blue)
            if (block.leftWords.includes(words.positive[0]) || block.leftWords.includes(words.negative[0])) {
                leftColor = 'blue';
            }
            
            // Check if right side contains traditional/industrial (green)
            if (block.rightWords.includes(words.traditional[0]) || block.rightWords.includes(words.industrial[0])) {
                rightColor = 'green';
            }
            // Check if right side contains positive/negative (blue)
            if (block.rightWords.includes(words.positive[0]) || block.rightWords.includes(words.negative[0])) {
                rightColor = 'blue';
            }
            
            // Create formatted labels
            const leftParts = block.leftCategory.split('\n');
            const rightParts = block.rightCategory.split('\n');
            
            let leftHTML = '';
            let rightHTML = '';
            
            if (leftParts.length === 3) {
                leftHTML = `<span class="category-main ${leftColor}">${leftParts[0]}</span><span class="category-or">hoặc</span><span class="category-sub ${leftColor}">${leftParts[2]}</span>`;
            } else {
                leftHTML = `<span class="category-main ${leftColor}">${leftParts[0]}</span>`;
            }
            
            if (rightParts.length === 3) {
                rightHTML = `<span class="category-main ${rightColor}">${rightParts[0]}</span><span class="category-or">hoặc</span><span class="category-sub ${rightColor}">${rightParts[2]}</span>`;
            } else {
                rightHTML = `<span class="category-main ${rightColor}">${rightParts[0]}</span>`;
            }
            
            leftLabel.innerHTML = leftHTML;
            rightLabel.innerHTML = rightHTML;

            // Generate trial list
            const allWords = [...block.leftWords, ...block.rightWords];
            const trialList = [];
            while (trialList.length < block.trials) {
                trialList.push(...allWords);
            }
            shuffleArray(trialList);
            
            // Fix consecutive duplicate words
            fixConsecutiveDuplicates(trialList);
            
            block.trialList = trialList.slice(0, block.trials);
            block.trialIndex = 0;
            lastWord = null; // Reset last word for new block

            currentTrial = 0;
            showTrial();
        }

        function showTrial() {
            const block = blocks[currentBlock];
            const word = block.trialList[currentTrial];

            const stimulus = document.getElementById('stimulus');
            stimulus.textContent = word;
            stimulus.classList.remove('traditional', 'industrial', 'positive', 'negative');
            
            // Determine word color based on category
            if (words.traditional.includes(word)) {
                stimulus.classList.add('traditional');
            } else if (words.industrial.includes(word)) {
                stimulus.classList.add('industrial');
            } else if (words.positive.includes(word)) {
                stimulus.classList.add('positive');
            } else if (words.negative.includes(word)) {
                stimulus.classList.add('negative');
            }
            
            // Track the displayed word
            lastWord = word;
            
            document.getElementById('feedback').classList.add('hidden');

            trialStartTime = performance.now();
        }

        function handleKeyPress(e) {
            if (e.key === 'Escape') {
                cancelExperiment();
                return;
            }

            // In instruction screens
            if (!document.getElementById('instructions').classList.contains('hidden')) {
                if (e.key === ' ') {
                    e.preventDefault();
                    if (currentInstructionIndex < instructions.length) {
                        nextInstruction();
                    } else {
                        startBlock();
                    }
                }
                return;
            }

            // In trial screen
            if (!document.getElementById('trial-screen').classList.contains('hidden')) {
                if (e.key === 'e' || e.key === 'E' || e.key === 'i' || e.key === 'I') {
                    e.preventDefault();
                    handleResponse(e.key.toLowerCase());
                }
            }
        }

        function handleResponse(key) {
            const block = blocks[currentBlock];
            const word = block.trialList[currentTrial];
            const rt = performance.now() - trialStartTime;

            // Determine correct response
            const correctKey = block.leftWords.includes(word) ? 'e' : 'i';
            const isCorrect = key === correctKey;

            if (!isCorrect) {
                // Show error feedback - store RT for first attempt
                if (firstAttemptRT === 0) {
                    firstAttemptRT = rt;
                }
                document.getElementById('feedback').textContent = 'X';
                document.getElementById('feedback').classList.remove('hidden');
                return; // Wait for correct response
            }

            // Save only one result - with error info but final correct RT
            const finalRT = firstAttemptRT > 0 ? firstAttemptRT : rt;
            
            // Track the correct response
            recentResponses.push(correctKey);
            // Keep only last 10 responses for efficiency
            if (recentResponses.length > 10) {
                recentResponses.shift();
            }
            
            results.push({
                participantID: participantInfo.loginCode,
                testDate: participantInfo.testDate,
                block: currentBlock + 1,
                blockType: block.isPractice ? 'Practice' : 'Critical',
                trial: currentTrial + 1,
                word: word,
                correctSide: correctKey === 'e' ? 'left' : 'right',
                rt: Math.round(rt), // Use final correct response RT
                correct: firstAttemptRT > 0 ? false : true // Mark as incorrect if there was an error
            });

            // Reset first attempt RT for next trial
            firstAttemptRT = 0;

            // Next trial
            currentTrial++;
            if (currentTrial < block.trials) {
                // Check if next word would cause 4+ consecutive same-key responses
                const nextWord = block.trialList[currentTrial];
                const nextCorrectKey = block.leftWords.includes(nextWord) ? 'e' : 'i';
                
                if (hasConsecutiveSameKey(recentResponses, nextCorrectKey, 4)) {
                    // If it would cause 4+ consecutive, re-shuffle the remaining words
                    const remainingWords = block.trialList.slice(currentTrial);
                    shuffleArray(remainingWords);
                    block.trialList.splice(currentTrial, remainingWords.length, ...remainingWords);
                }
                
                setTimeout(showTrial, 300);
            } else {
                // Block complete
                document.getElementById('trial-screen').classList.add('hidden');
                currentBlock++;
                if (currentBlock < blocks.length) {
                    showBlockInstruction(currentBlock);
                } else {
                    finishExperiment();
                }
            }
        }

        function finishExperiment() {
            // Calculate D-score only from blocks 4 and 7
            const block4 = results.filter(r => r.block === 4 && r.correct);
            const block7 = results.filter(r => r.block === 7 && r.correct);

            const block4RT = block4.reduce((sum, r) => sum + r.rt, 0) / block4.length;
            const block7RT = block7.reduce((sum, r) => sum + r.rt, 0) / block7.length;

            const criticalRTs = [...block4, ...block7].map(r => r.rt);
            const pooledSD = calculateSD(criticalRTs);

            const dScore = (block7RT - block4RT) / pooledSD;

            // Show end screen
            document.getElementById('end-screen').classList.remove('hidden');
            document.getElementById('d-score-display').innerHTML = `
                <strong>D-Score: ${dScore.toFixed(3)}</strong><br>
                Block 4 RT: ${block4RT.toFixed(2)}ms<br>
                Block 7 RT: ${block7RT.toFixed(2)}ms
            `;

            // Auto download results
            downloadExcel();

            // Remove keyboard listener
            document.removeEventListener('keydown', handleKeyPress);
        }

        function cancelExperiment() {
            experimentCancelled = true;
            document.getElementById('instructions').classList.add('hidden');
            document.getElementById('trial-screen').classList.add('hidden');
            document.getElementById('cancelled-screen').classList.remove('hidden');
            document.removeEventListener('keydown', handleKeyPress);
        }

        function downloadResults() {
            const csv = convertToCSV(results);
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', `IAT_Details_${participantInfo.loginCode}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function downloadExcel() {
            // Include all blocks (1-7), not just critical blocks
            const finalResults = results;
            
            // Create worksheet data
            const headers = ['Participant ID', 'Test Date', 'Block', 'Block Type', 'Trial', 'Word', 'Correct Side', 'RT (ms)', 'Correct'];
            const rows = finalResults.map(r => [
                r.participantID,
                r.testDate,
                r.block,
                r.blockType,
                r.trial,
                r.word,
                r.correctSide,
                r.rt,
                r.correct ? 'Yes' : 'No'
            ]);
            
            // Create CSV content
            let csv = headers.join(',') + '\n';
            rows.forEach(row => {
                csv += row.map(cell => {
                    // Escape quotes and wrap in quotes if contains comma
                    const escaped = String(cell).replace(/"/g, '""');
                    return escaped.includes(',') ? `"${escaped}"` : escaped;
                }).join(',') + '\n';
            });
            
            // Create Excel file
            const blob = new Blob([csv], { type: 'application/vnd.ms-excel;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', `IAT_Results_${participantInfo.loginCode}.xlsx`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function convertToCSV(data) {
            if (data.length === 0) return '';
            const headers = Object.keys(data[0]);
            const rows = data.map(obj => headers.map(h => obj[h]).join(','));
            return [headers.join(','), ...rows].join('\n');
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function hasConsecutiveSameKey(responses, newKey, maxConsecutive = 4) {
            // Check if adding newKey would create maxConsecutive or more consecutive same-key responses
            let count = 1; // Count the new key
            for (let i = responses.length - 1; i >= 0; i--) {
                if (responses[i] === newKey) {
                    count++;
                    if (count >= maxConsecutive) {
                        return true; // Would exceed max consecutive
                    }
                } else {
                    break; // Stop counting when we hit a different key
                }
            }
            return false;
        }

        function hasConsecutiveSameWord(trialList, currentIndex) {
            // Check if current word is the same as next word
            if (currentIndex >= trialList.length - 1) {
                return false; // No next word to compare
            }
            return trialList[currentIndex] === trialList[currentIndex + 1];
        }

        function fixConsecutiveDuplicates(trialList) {
            // Fix any consecutive duplicate words in the trial list
            let fixed = true;
            while (fixed) {
                fixed = false;
                for (let i = 0; i < trialList.length - 1; i++) {
                    if (trialList[i] === trialList[i + 1]) {
                        // Found consecutive duplicates, swap with a different word
                        // Find a word to swap with (prefer one that's not the same as both neighbors)
                        for (let j = i + 2; j < trialList.length; j++) {
                            if (trialList[j] !== trialList[i]) {
                                // Swap
                                [trialList[i + 1], trialList[j]] = [trialList[j], trialList[i + 1]];
                                fixed = true;
                                break;
                            }
                        }
                        if (!fixed && i + 2 < trialList.length) {
                            // If no perfect swap found, just swap with last element
                            [trialList[i + 1], trialList[trialList.length - 1]] = [trialList[trialList.length - 1], trialList[i + 1]];
                            fixed = true;
                        }
                    }
                }
            }
            return trialList;
        }

        function calculateSD(values) {
            const mean = values.reduce((sum, val) => sum + val, 0) / values.length;
            const variance = values.reduce((sum, val) => sum + Math.pow(val - mean, 2), 0) / values.length;
            return Math.sqrt(variance);
        }
